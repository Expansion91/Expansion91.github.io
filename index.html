<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toni Huhtiniemi – Kotisivu</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --link: #0066cc;
      --border: #e5e5e5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --text: #f5f5f5;
        --muted: #aaaaaa;
        --link: #66b3ff;
        --border: #333333;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    main {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    .profile {
      width: 240px;
      height: 240px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      margin: 0 0 0.5rem;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0.5rem 0;
    }

    .links {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    a:hover {
      border-color: currentColor;
    }
  </style>
</head>
<body>
  <main>
    <img class="profile" src="profiilikuva.jpg" alt="Kuva minusta">
    <h1>Toni Huhtiniemi</h1>
    
    <!-- Peruslinkit (GitHub & Sähköposti) -->
    <nav class="links" aria-label="Linkit">
      <a href="https://github.com/Expansion91">GitHub</a>
      <a href="mailto:huhtiniemiton@gmail.com">Sähköposti</a>
    </nav>

    <!-- UUSI OSIO: Tutkimuspaperi erillään -->
    <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border);">
      <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em;">Tutkimuspaperit</p>
      <nav class="links" aria-label="Tutkimuspaperi">
        <a href="surrealism_and_super_turing.pdf" target="_blank">📄 Surrealismi ja Super-Turing (PDF)</a>
      </nav>
    </div>

  </main>
</body>
</html>
